// build.gradle (Fabric Loom) — pinned placeholders for Minecraft 1.21.0
plugins {
    id 'fabric-loom' version '0.14.+'
    id 'java'
}

group = 'com.bienenarla'
version = '1.0.0'
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

def minecraftVersion = '1.21.0'
def yarnMappings = '1.21.0+build.1'
def loaderVersion = '0.18.+')
def fabricApiVersion = '0.87.+"

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings "net.fabricmc:yarn:${yarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    // Add other dependencies converted from the Forge build.gradle as needed
}

java {
    withSourcesJar()
}

loom {
    // Loom configuration (mixins, run configs) can be added here if needed
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}